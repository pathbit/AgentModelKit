name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentmodelkit-release-publication
  queue: max

jobs:
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate tag and branch
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json"));
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || process.env.GITHUB_REF_NAME !== "v" + version) {
              throw new Error("The tag must match a stable package version");
            }
          '
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$RELEASE_BRANCH"
      - name: Pack and execute release candidate
        env:
          AGENTMODELKIT_ARTIFACT_DIR: ${{ runner.temp }}/release
        run: npm run test:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentmodelkit-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  npmjs:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npmjs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@pathbit'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentmodelkit-release
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Publish or verify same npmjs package
        env:
          NODE_AUTH_TOKEN: ${{ github.ref_name == 'v0.0.1' && (secrets.NPMJS_BOOTSTRAP_TOKEN || secrets.NPMJS_TOKEN) || '' }}
        run: node scripts/publish-package.mjs npmjs "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release"

  github:
    needs: [package, verify-npmjs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@pathbit'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentmodelkit-release
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Publish or verify same GitHub package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/publish-package.mjs github "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release"
      - name: Create or verify GitHub Release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null; then
            verify_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" --pattern '*.tgz' --dir "$verify_dir"
            cmp ./*.tgz "$verify_dir"/*.tgz
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes
          fi

  verify-npmjs:
    needs: [package, npmjs]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentmodelkit-release
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify public registry metadata and tarball
        run: node scripts/verify-npm-release.mjs "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release/integrity.txt"
      - name: Execute the published package
        working-directory: ${{ runner.temp }}
        env:
          npm_config_cache: ${{ runner.temp }}/npm-consumer-cache
          npm_config_registry: https://registry.npmjs.org
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(npm exec --yes --ignore-scripts -- "@pathbit/agentmodelkit@$version" --version)" = "$version"
          latest="$(npm view @pathbit/agentmodelkit@latest version --prefer-online)"
          if test "$latest" = "$version"; then
            test "$(npm exec --yes --ignore-scripts -- @pathbit/agentmodelkit@latest --version)" = "$version"
          fi
