name: Relatar um problema
description: Informe uma falha com passos para reproduzi-la.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Consulte a [documentação](../docs/README.md) e remova qualquer API key,
        arquivo `.key`, token ou caminho pessoal antes de enviar.
  - type: input
    id: version
    attributes:
      label: Versão do AgentModelKit e Node.js
      placeholder: "AgentModelKit 0.1.0; Node.js 22.x"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Sistema operacional
      placeholder: "Windows 11 x64, macOS arm64 ou Ubuntu 24.04 x64"
    validations:
      required: true
  - type: input
    id: client_provider
    attributes:
      label: Provider e cliente afetados
      placeholder: "opencode (free) / freellmapi -> copilot-cli, vscode"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Comando executado
      render: text
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Comportamento esperado vs observado
    validations:
      required: true
  - type: textarea
    id: doctor_output
    attributes:
      label: Saída de `agentmodelkit doctor` (opcional, sem segredos)
      render: text
