name: Sugerir un proveedor o cliente (Español)
description: Proponga un proveedor, un flujo OAuth, un editor o una CLI.
title: "[Mejora]: "
labels: [enhancement]
body:
  - type: dropdown
    id: category
    attributes:
      label: Categoría
      options:
        - Nuevo proveedor (por ejemplo OpenRouter, Ollama, Groq)
        - Nuevo cliente, editor o CLI (por ejemplo Claude Code Desktop, Cursor, Codex)
        - OAuth o flujo de dispositivo
        - Documentación o experiencia de usuario
        - Otra mejora
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Describa la propuesta
      description: Incluya las rutas de configuración, el formato JSON o TOML esperado y los enlaces oficiales cuando corresponda.
    validations:
      required: true
